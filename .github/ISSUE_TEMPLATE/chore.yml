name: "Chore: Maintenance and Operations"
description: Request maintenance, tooling, or operational work.
title: "chore: "
labels:
  - type:chore
body:
  - type: textarea
    id: requested_change
    attributes:
      label: Requested change
      description: Describe the maintenance, tooling, or operational change you are requesting.
      placeholder: What should be changed?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain why this change is needed.
      placeholder: What problem or need does this address?
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: List the outcomes that will show this request is complete.
      placeholder: What must be true when the work is finished?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: Note any constraints, exclusions, or non-goals.
      placeholder: What should remain unchanged or out of scope?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share relevant background, references, or operational details.
      placeholder: Add any useful context.
    validations:
      required: false
