services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: botanica-ob
    volumes:
      - mongo-data:/data/db
    # Bind only to localhost so the port is never exposed to the internet.
    # Only accessible from the host itself (Docker Desktop on Windows, WSL/Linux).
  mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
